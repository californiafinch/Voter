<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>选民行会</title>
    <link rel="stylesheet" href="timeline.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="preload" href="data/events.js" as="script">
    <link rel="preload" href="data/characters.js" as="script">
    <link rel="preload" href="timeline-optimized.js" as="script">
</head>
<body>
    <div class="container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在加载...</div>
        </div>

        <div class="toast-container" id="toastContainer"></div>

        <nav class="fixed-nav-bar" id="fixedNavBar">
            <div class="nav-brand">
                <h1 class="title">选民行会</h1>
                <span class="subtitle">理想国</span>
            </div>

            <div class="nav-toolbar">
                <select class="filter-select search-scope" id="searchScope">
                    <option value="all" selected>全部</option>
                    <option value="events">事件</option>
                    <option value="characters">人物</option>
                    <option value="region">地区</option>
                    <option value="period">时期</option>
                </select>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索...">
                <button class="search-btn" id="searchBtn">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="8" fill="white" stroke="#999" stroke-width="2"/>
                        <line x1="17" y1="17" x2="21" y2="21" stroke="#999" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>

                <button class="nav-btn reset-btn" id="resetBtn">重置</button>

                <select class="filter-select" id="categoryFilter">
                    <option value="all" selected>事件</option>
                    <option value="military">军事</option>
                    <option value="diplomacy">外交</option>
                    <option value="organize">组织</option>
                    <option value="personage">人物</option>
                </select>

                <select class="filter-select" id="characterCategoryFilter">
                    <option value="all" selected>人物</option>
                    <option value="energy">能量派</option>
                    <option value="projective">投影派</option>
                    <option value="intervene">干涉派</option>
                    <option value="orientate">定位派</option>
                </select>

                <select class="filter-select" id="regionFilter">
                    <option value="all" selected>地区</option>
                    <option value="华夏区">华夏区</option>
                    <option value="亚洲区">亚洲区</option>
                    <option value="欧洲区">欧洲区</option>
                    <option value="北美区">北美区</option>
                    <option value="拉美区">拉美区</option>
                    <option value="非洲区">非洲区</option>
                </select>

                <select class="filter-select" id="periodFilter">
                    <option value="all" selected>时期</option>
                    <option value="远古">远古</option>
                    <option value="上古">上古</option>
                    <option value="中古">中古</option>
                    <option value="近代">近代</option>
                    <option value="现代">现代</option>
                    <option value="当代">当代</option>
                </select>

                <div class="zoom-controls">
                    <button class="nav-btn zoom-btn" id="zoomOutBtn">-</button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <button class="nav-btn zoom-btn" id="zoomInBtn">+</button>
                </div>

                <button class="nav-btn mobile-filter-btn" id="mobileFilterBtn">☰</button>
            </div>

            <div class="filter-tags-bar" id="filterTagsBar"></div>
        </nav>

        <button class="nav-expand-btn" id="navExpandBtn" title="展开菜单">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="4" y1="6" x2="20" y2="6" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <line x1="4" y1="12" x2="20" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <line x1="4" y1="18" x2="20" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>

        <main class="main-content">
            <div class="no-results" id="noResults">
                <p>抱歉，没有找到相关结果。</p>
                <p id="countdownText">5秒后自动返回</p>
            </div>

            <div class="view timeline-view active" id="timelineView">
                <div class="timeline-container">
                    <div class="timeline" id="timeline">
                        <div class="timeline-line"></div>
                    </div>
                </div>
            </div>

            <div class="view characters-view" id="charactersView">
                <div class="characters-grid" id="charactersGrid"></div>
            </div>

            <div class="view favorites-view" id="favoritesView">
                <div class="favorites-tabs">
                    <button class="favorites-tab active" data-tab="events">收藏的事件</button>
                    <button class="favorites-tab" data-tab="characters">收藏的人物</button>
                </div>
                <div class="favorites-content" id="favoritesContent"></div>
            </div>
        </main>

        <button class="back-to-top" id="backToTop" title="回到顶部">↑</button>

        <nav class="bottom-nav">
            <div class="bottom-nav-item active" data-view="timelineView">
                <div class="bottom-nav-icon">📅</div>
                <div class="bottom-nav-label">时间线</div>
            </div>
            <div class="bottom-nav-item" data-view="charactersView">
                <div class="bottom-nav-icon">👥</div>
                <div class="bottom-nav-label">人物</div>
            </div>
            <div class="bottom-nav-item" data-view="favoritesView">
                <div class="bottom-nav-icon">⭐</div>
                <div class="bottom-nav-label">收藏</div>
            </div>
        </nav>

        <div class="mobile-filter-drawer" id="mobileFilterDrawer">
            <div class="drawer-overlay" id="drawerOverlay"></div>
            <div class="drawer-content">
                <div class="drawer-header">
                    <h3>筛选条件</h3>
                    <button class="drawer-close" id="drawerClose">&times;</button>
                </div>
                <div class="drawer-body">
                    <div class="drawer-section">
                        <label>事件类别</label>
                        <select class="filter-select" id="mobileCategoryFilter">
                            <option value="all" selected>全部</option>
                            <option value="military">军事</option>
                            <option value="diplomacy">外交</option>
                            <option value="organize">组织</option>
                            <option value="personage">人物</option>
                        </select>
                    </div>
                    <div class="drawer-section">
                        <label>人物派别</label>
                        <select class="filter-select" id="mobileCharacterCategoryFilter">
                            <option value="all" selected>全部</option>
                            <option value="energy">能量派</option>
                            <option value="projective">投影派</option>
                            <option value="intervene">干涉派</option>
                            <option value="orientate">定位派</option>
                        </select>
                    </div>
                    <div class="drawer-section">
                        <label>地区</label>
                        <select class="filter-select" id="mobileRegionFilter">
                            <option value="all" selected>全部</option>
                            <option value="华夏区">华夏区</option>
                            <option value="亚洲区">亚洲区</option>
                            <option value="欧洲区">欧洲区</option>
                            <option value="北美区">北美区</option>
                            <option value="拉美区">拉美区</option>
                            <option value="非洲区">非洲区</option>
                        </select>
                    </div>
                    <div class="drawer-section">
                        <label>时期</label>
                        <select class="filter-select" id="mobilePeriodFilter">
                            <option value="all" selected>全部</option>
                            <option value="远古">远古</option>
                            <option value="上古">上古</option>
                            <option value="中古">中古</option>
                            <option value="近代">近代</option>
                            <option value="现代">现代</option>
                            <option value="当代">当代</option>
                        </select>
                    </div>
                    <div class="drawer-section">
                        <label>搜索范围</label>
                        <select class="filter-select" id="mobileSearchScope">
                            <option value="all" selected>全部</option>
                            <option value="events">事件</option>
                            <option value="characters">人物</option>
                            <option value="region">地区</option>
                            <option value="period">时期</option>
                        </select>
                    </div>
                    <div class="drawer-section">
                        <label>关键词搜索</label>
                        <input type="text" class="drawer-search-input" id="mobileSearchInput" placeholder="输入搜索词...">
                    </div>
                </div>
                <div class="drawer-footer">
                    <button class="drawer-btn drawer-reset" id="drawerReset">重置</button>
                    <button class="drawer-btn drawer-apply" id="drawerApply">应用筛选</button>
                </div>
            </div>
        </div>

        <div class="event-modal" id="eventModal">
            <div class="modal-overlay" id="eventModalOverlay"></div>
            <div class="modal-content event-modal-content">
                <button class="modal-close" id="eventModalClose">&times;</button>
                <div class="event-detail" id="eventDetail">
                </div>
                <div class="event-modal-nav">
                    <button class="event-nav-btn" id="prevEventBtn">← 上一个</button>
                    <button class="event-nav-btn" id="nextEventBtn">下一个 →</button>
                </div>
            </div>
        </div>

        <div class="character-modal" id="characterModal">
            <div class="modal-overlay" id="modalOverlay"></div>
            <div class="modal-content">
                <button class="modal-close" id="modalClose">&times;</button>
                <div class="character-info" id="characterInfo">
                </div>
            </div>
        </div>
    </div>

    <script src="data/events.js"></script>
    <script src="data/characters.js"></script>
    <script src="timeline-optimized.js"></script>
</body>
</html>
