name: HTML Files Sync Check

# 触发条件：当代码推送到 main 分支时运行
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      # 步骤 1：检出代码
      - uses: actions/checkout@v3

      # 步骤 2：验证 index.html 文件存在性
      - name: Verify index.html exists
        run: |
          echo "Verifying index.html exists..."
          if [ -f "index.html" ]; then
            echo "✅ index.html exists"
          else
            echo "❌ index.html missing"
            exit 1
          fi

      # 步骤 3：验证文件大小
      - name: Verify index.html size
        run: |
          echo "Verifying index.html size..."
          FILE_SIZE=$(wc -c < "index.html")
          if [ "$FILE_SIZE" -gt 0 ]; then
            echo "✅ index.html has content ($FILE_SIZE bytes)"
          else
            echo "❌ index.html is empty"
            exit 1
          fi

      # 步骤 4：验证关键功能
      - name: Verify key features in index.html
        run: |
          echo "Verifying key features in index.html..."
          if grep -q 'id="regionFilter"' "index.html" && \
             grep -q 'id="periodFilter"' "index.html" && \
             grep -q 'id="searchScope"' "index.html"; then
            echo "✅ index.html contains all key features"
          else
            echo "❌ index.html missing some key features"
            exit 1
          fi

      # 步骤 5：显示成功消息
      - name: Display success message
        if: success()
        run: |
          echo "🎉 All checks passed!"
          echo "index.html is ready for deployment"
          echo "GitHub Pages should display the latest changes correctly"